# Authelia for the desktop application (module 6): people only. Service-to-model authentication uses
# client certificates at the model gateway and does not involve Authelia.
#
# Secrets come from files (AUTHELIA_*_FILE in app/compose.yaml); users from users_database.yml, both
# generated by scripts/setup-app-auth.sh into secrets/authelia/.
---
theme: light

server:
  address: tcp://0.0.0.0:9091/
  endpoints:
    authz:
      auth-request:
        implementation: AuthRequest
        authn_strategies:
          # CLI, harnesses, and Locust send HTTP Basic; browsers use the portal's session cookie.
          - name: HeaderAuthorization
            schemes: [Basic]
          - name: CookieSession

log:
  level: info
  format: json

authentication_backend:
  password_reset:
    disable: true
  file:
    path: /run/taco-authelia/users_database.yml
    watch: false
    password:
      algorithm: argon2

access_control:
  default_policy: deny
  rules:
    # Fault injection and fixture reset: the admin group only.
    - domain: app.taco.internal
      resources: ['^/admin([/?].*)?$', '^/case-admin([/?].*)?$']
      subject: 'group:admin'
      policy: one_factor
    - domain: app.taco.internal
      resources: ['^/admin([/?].*)?$', '^/case-admin([/?].*)?$']
      policy: deny
    # Everything else: any application role. What each role may do with a case is decided by the API.
    - domain: app.taco.internal
      subject:
        - 'group:service_rep'
        - 'group:reviewer'
        - 'group:area_manager'
        - 'group:quality_reviewer'
        - 'group:auditor'
      policy: one_factor

session:
  cookies:
    - domain: taco.internal
      authelia_url: https://auth.taco.internal:8443
      default_redirection_url: https://app.taco.internal:8443/ui
  expiration: 8h
  inactivity: 1h

regulation:
  max_retries: 5
  find_time: 2m
  ban_time: 5m

storage:
  local:
    path: /var/lib/authelia/db.sqlite3

notifier:
  filesystem:
    filename: /var/lib/authelia/notification.txt
