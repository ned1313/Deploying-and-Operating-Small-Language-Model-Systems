# Application project (desktop): complaint API, mock case API, and the one-shots that act on them.
# Run every command from app/.
#
#   cp .env.example .env                                      # inference contract, admin token, LangSmith
#   printf 'demo-key' > ../secrets/inference_api_key          # once; see ../secrets/README.md
#   podman network create taco-telemetry                      # once per desktop; shared with observability/
#   podman-compose build
#   podman-compose run --rm seed
#   podman-compose up -d case-api                             # module 2
#   podman-compose run --rm basic-agent --check               # module 2
#   podman-compose up -d complaint-api                        # module 3 onward
#   podman-compose run --rm cli submit A01                    # module 3 onward
#   podman-compose up -d authelia app-gateway                 # module 6 (APP_AUTH_MODE=authelia in .env)
#
# Services by module: case-api, seed, basic-agent (2); complaint-api, cli (3); authelia, app-gateway (6).
# Evaluation, load, and report one-shots are in tools/. The model server is NOT part of this project (model-host/).
# No `profiles:` (podman-compose 1.0.x hides profiled services) and no `depends_on` on one-shot services
# (`podman-compose run` would recreate the running APIs). Always name services with `up`; avoid `down`.

name: taco-app

x-app-image: &app-image
  image: localhost/taco-app:latest
  build:
    context: ..
    dockerfile: app/Containerfile
    args:
      APP_VERSION: ${APP_VERSION:-dev}

x-inference-env: &inference-env
  INFERENCE_BASE_URL: ${INFERENCE_BASE_URL:?copy .env.example to .env and set INFERENCE_BASE_URL}
  INFERENCE_MODEL: ${INFERENCE_MODEL:?set INFERENCE_MODEL in .env}
  INFERENCE_TIMEOUT_SECONDS: ${INFERENCE_TIMEOUT_SECONDS:-120}
  INFERENCE_EXTRA_BODY: ${INFERENCE_EXTRA_BODY:-}
  INFERENCE_TOOL_CALLING: ${INFERENCE_TOOL_CALLING:-native}
  INFERENCE_STRUCTURED_OUTPUT: ${INFERENCE_STRUCTURED_OUTPUT:-json_schema}
  INFERENCE_MAX_RETRIES: ${INFERENCE_MAX_RETRIES:-2}
  INFERENCE_API_KEY_FILE: /run/secrets/inference_api_key
  # Module 6: the course root CA and the complaint-api client certificate (empty: plain HTTP, modules 1-5).
  INFERENCE_CA_FILE: ${INFERENCE_CA_FILE:-}
  INFERENCE_CLIENT_CERT_FILE: ${INFERENCE_CLIENT_CERT_FILE:-}
  INFERENCE_CLIENT_KEY_FILE: ${INFERENCE_CLIENT_KEY_FILE:-}
  AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-8}
  AGENT_MAX_OUTPUT_TOKENS: ${AGENT_MAX_OUTPUT_TOKENS:-800}
  TACO_POLICY_VERSION: ${TACO_POLICY_VERSION:-2026.09}
  TACO_APP_DB: /data/app/taco_app.db
  CASE_API_URL: http://case-api:8081

# Module 6: resolve the model gateway's certificate name to the GPU host (unused with an IP base URL).
x-model-host: &model-host
  - "${SLM_HOSTNAME:-slm.taco.internal}:${MODEL_HOST:-127.0.0.1}"

services:
  case-api:
    <<: *app-image
    command: ["uvicorn", "case_api.main:app", "--host", "0.0.0.0", "--port", "8081"]
    environment:
      TACO_CASE_DB: /data/cases/cases.db
      TACO_ADMIN_TOKEN: ${TACO_ADMIN_TOKEN:-}
      APP_AUTH_MODE: ${APP_AUTH_MODE:-header}
      APP_GATEWAY_SECRET_FILE: /run/taco-gateway/shared_secret
    volumes:
      - taco-case-data:/data/cases    # this service is the only writer
      - ../secrets/gateway:/run/taco-gateway:ro   # module 6: proves admin calls came through app-gateway
    ports:
      - "${PUBLISH_ADDRESS:-127.0.0.1}:${CASE_API_PORT:-8081}:8081"   # loopback by default, for on-camera curl
    healthcheck:
      test: ["CMD", "python", "-m", "taco_shared.healthcheck", "http://127.0.0.1:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  complaint-api:
    <<: *app-image
    environment:
      <<: *inference-env
      WORKFLOW_MAX_NUDGES: ${WORKFLOW_MAX_NUDGES:-1}
      WORKFLOW_MAX_CORRECTIONS: ${WORKFLOW_MAX_CORRECTIONS:-1}
      WORKFLOW_RUN_TIMEOUT_SECONDS: ${WORKFLOW_RUN_TIMEOUT_SECONDS:-90}
      WORKFLOW_MAX_CONCURRENT_RUNS: ${WORKFLOW_MAX_CONCURRENT_RUNS:-4}
      WORKFLOW_QUEUE_TIMEOUT_SECONDS: ${WORKFLOW_QUEUE_TIMEOUT_SECONDS:-60}
      CASE_API_TIMEOUT_SECONDS: ${CASE_API_TIMEOUT_SECONDS:-3}
      CASE_API_RETRIES: ${CASE_API_RETRIES:-2}
      CASE_API_BACKOFF_SECONDS: ${CASE_API_BACKOFF_SECONDS:-0.5}
      TACO_STATE_DIR: /data/state
      TACO_ADMIN_TOKEN: ${TACO_ADMIN_TOKEN:-}
      # LangSmith tracing (module 4); off unless LANGSMITH_TRACING=true in .env.
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-taco-alley}
      LANGSMITH_TRACING_SAMPLING_RATE: ${LANGSMITH_TRACING_SAMPLING_RATE:-1.0}
      LANGSMITH_HIDE_INPUTS: ${LANGSMITH_HIDE_INPUTS:-false}
      LANGSMITH_HIDE_OUTPUTS: ${LANGSMITH_HIDE_OUTPUTS:-false}
      # Quality sampling (module 5); 0 turns it off.
      QUALITY_SAMPLE_RATE: ${QUALITY_SAMPLE_RATE:-0}
      TACO_QUALITY_DB: /data/quality/quality.db
      # Module 6: who the caller is (header | authelia), audit capture (on when the key file exists),
      # and what LangSmith may export (full | redacted | none).
      APP_AUTH_MODE: ${APP_AUTH_MODE:-header}
      APP_GATEWAY_SECRET_FILE: /run/taco-gateway/shared_secret
      AUTHELIA_URL: https://${AUTH_HOSTNAME:-auth.taco.internal}:${APP_GATEWAY_PORT:-8443}
      AUDIT_KEY_FILE: /run/taco-audit/audit_content_key
      TACO_AUDIT_DB: /data/audit/audit.db
      TRACE_CONTENT_POLICY: ${TRACE_CONTENT_POLICY:-full}
    secrets:
      - inference_api_key
    volumes:
      - taco-app-data:/data/app:ro    # seeded orders and history; written only by `seed`
      - taco-app-state:/data/state    # checkpoints.db and app.db; this service is the only writer
      - taco-app-quality:/data/quality  # evaluation store; the tools project's `quality` service also writes it
      - taco-app-audit:/data/audit    # module 6: audit store; this service is the only writer
      - ../secrets/certs/complaint-api:/run/taco-certs:ro   # module 6: client certificate for the model gateway
      - ../secrets/gateway:/run/taco-gateway:ro
      - ../secrets/audit:/run/taco-audit:ro
    extra_hosts: *model-host
    ports:
      - "${PUBLISH_ADDRESS:-127.0.0.1}:${COMPLAINT_API_PORT:-8090}:8090"   # header mode: X-Actor-Id is an unauthenticated claim, keep this host-only
    networks:
      - default
      - telemetry                     # Prometheus scrapes /metrics here; joining grants no API rights
    healthcheck:
      test: ["CMD", "python", "-m", "taco_shared.healthcheck", "http://127.0.0.1:8090/healthz?remote=false"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  seed:
    # One-shot: podman-compose run --rm seed [--reset]
    <<: *app-image
    entrypoint: ["python", "-m", "taco_shared.dataset.seed"]
    command: []
    environment:
      TACO_APP_DB: /data/app/taco_app.db
    volumes:
      - taco-app-data:/data/app

  basic-agent:
    # Module 2 teaching script: podman-compose run --rm basic-agent --mode tools --scenario A01
    <<: *app-image
    entrypoint: ["python", "examples/basic_agent.py"]
    command: ["--check"]
    environment:
      <<: *inference-env
      TACO_ACTOR: ${TACO_ACTOR:-rep-kop-01}
      RESULTS_DIR: /app/results
    secrets:
      - inference_api_key
    volumes:
      - taco-app-data:/data/app:ro    # read-only: the script never writes application state
      - ../results/agent:/app/results # --save-transcript only
      - ../secrets/certs/complaint-api:/run/taco-certs:ro   # module 6: same identity as complaint-api
    extra_hosts: *model-host

  cli:
    # podman-compose run --rm cli submit A01 | show CASE-10431 | reviews | approve CASE-10431 | audit CASE-10431 ...
    <<: *app-image
    entrypoint: ["python", "clients/taco_cli.py"]
    command: ["--help"]
    environment:
      COMPLAINT_API_URL: http://complaint-api:8090
      CASE_API_URL: http://case-api:8081
      TACO_ADMIN_TOKEN: ${TACO_ADMIN_TOKEN:-}
      # Module 6: through app-gateway with HTTP Basic (actor id and the shared demo password).
      APP_AUTH_MODE: ${APP_AUTH_MODE:-header}
      APP_GATEWAY_URL: https://${APP_HOSTNAME:-app.taco.internal}:8443
      APP_CA_FILE: /run/taco-ca/root_ca.crt
      TACO_USER_PASSWORD_FILE: /run/taco-users/password
    volumes:
      - ../secrets/ca:/run/taco-ca:ro
      - ../secrets/users:/run/taco-users:ro

  reset:
    # Module 6: explicit, destructive reset of the demo data; lists first, deletes only with --yes.
    # podman-compose stop complaint-api case-api && podman-compose run --rm reset --yes
    # The audit volume is deliberately not mounted: a demo reset cannot erase the audit trail.
    <<: *app-image
    entrypoint: ["python", "clients/reset_demo.py"]
    command: []
    environment:
      TACO_APP_DB: /data/app/taco_app.db
    volumes:
      - taco-app-data:/data/app
      - taco-app-state:/data/state
      - taco-app-quality:/data/quality
      - taco-case-data:/data/cases

  # ----- module 6: people sign in through Authelia; app-gateway enforces it ---------------------------
  authelia:
    image: docker.io/authelia/authelia:4.39.28
    environment:
      AUTHELIA_SESSION_SECRET_FILE: /run/taco-authelia/session_secret
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /run/taco-authelia/storage_encryption_key
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /run/taco-authelia/jwt_secret
    volumes:
      - ./authelia/configuration.yml:/config/configuration.yml:ro
      - ../secrets/authelia:/run/taco-authelia:ro   # secrets and users_database.yml (scripts/setup-app-auth.sh)
      - taco-authelia-data:/var/lib/authelia
    restart: unless-stopped

  app-gateway:
    # TLS for app.taco.internal and auth.taco.internal; forward auth to Authelia for every app route.
    image: docker.io/library/nginx:1.30.6
    # NGINX cannot read a file into a variable: the shared secret is exported for the template step.
    entrypoint: ["/bin/sh", "-c", "export APP_GATEWAY_SECRET=\"$$(cat /run/taco-gateway/shared_secret)\" && exec /docker-entrypoint.sh nginx -g 'daemon off;'"]
    environment:
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"
      NGINX_ENVSUBST_FILTER: "^(APP_GATEWAY_SECRET|NGINX_LOCAL_RESOLVERS)$$"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/gateway.conf.template:/etc/nginx/templates/gateway.conf.template:ro
      - ../secrets/certs/app-gateway:/etc/nginx/certs:ro
      - ../secrets/gateway:/run/taco-gateway:ro
    ports:
      - "${PUBLISH_ADDRESS:-127.0.0.1}:${APP_GATEWAY_PORT:-8443}:8443"
    networks:
      default:
        aliases: ["${APP_HOSTNAME:-app.taco.internal}", "${AUTH_HOSTNAME:-auth.taco.internal}"]
    restart: unless-stopped

secrets:
  inference_api_key:
    file: ../secrets/inference_api_key

volumes:
  taco-app-data:
    name: taco-app-data
  taco-case-data:
    name: taco-case-data
  taco-app-state:
    name: taco-app-state
  taco-app-quality:
    name: taco-app-quality
  taco-app-audit:
    name: taco-app-audit
  taco-authelia-data:
    name: taco-authelia-data

networks:
  default:
    name: taco-app-private
  telemetry:
    external: true
    name: taco-telemetry
