# Module 6 app-gateway (desktop): TLS for the complaint API and the Authelia portal, and forward auth to
# Authelia on every application route. Authelia decides who the caller is (session cookie or HTTP Basic)
# and whether the route is allowed for their groups; the complaint API decides what they may do with a case.

worker_processes 1;
events { worker_connections 1024; }

http {
    # resolver (service names are resolved per request) and the shared secret; rendered from a template.
    include /etc/nginx/conf.d/gateway.conf;

    map $http_x_request_id $taco_request_id {
        "~^[A-Za-z0-9._-]{1,64}$" $http_x_request_id;
        default                  $request_id;
    }

    # The signed-in user, never the password or the session cookie.
    log_format app escape=json '{"ts":"$time_iso8601","request_id":"$taco_request_id","host":"$host",'
                   '"user":"$taco_user","method":"$request_method","route":"$uri","status":$status,'
                   '"request_time":$request_time}';
    access_log /dev/stdout app;
    error_log  /dev/stderr warn;

    ssl_certificate     /etc/nginx/certs/tls.crt;
    ssl_certificate_key /etc/nginx/certs/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    client_max_body_size 64k;

    # ----- Authelia portal ----------------------------------------------------------------------------
    server {
        listen 8443 ssl;
        server_name auth.taco.internal;
        set $taco_user "";
        set $authelia http://authelia:9091;

        location / {
            proxy_pass       $authelia;
            proxy_set_header Host $host;
            proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-URI $request_uri;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
    }

    # ----- complaint API, review UI, and the case API's admin routes -------------------------------------
    server {
        listen 8443 ssl default_server;
        server_name app.taco.internal;
        set $taco_user "";
        set $complaint_api http://complaint-api:8090;
        proxy_read_timeout 300s;   # workflow runs call the model several times

        location = /internal/authelia/authz {
            internal;
            set $authz http://authelia:9091/api/authz/auth-request;
            proxy_pass              $authz;
            proxy_set_header        X-Original-Method $request_method;
            proxy_set_header        X-Original-URL $scheme://$http_host$request_uri;
            proxy_set_header        X-Forwarded-For $remote_addr;
            proxy_set_header        Content-Length "";
            proxy_set_header        Connection "";
            proxy_pass_request_body off;
        }

        # Readiness without a login (process liveness only).
        location = /healthz {
            proxy_pass $complaint_api/healthz?remote=false;
        }

        # Browser pages: an unauthenticated visitor is redirected to the Authelia portal.
        location /ui {
            auth_request /internal/authelia/authz;
            auth_request_set $taco_user $upstream_http_remote_user;
            auth_request_set $taco_groups $upstream_http_remote_groups;
            auth_request_set $redirection_url $upstream_http_location;
            error_page 401 =302 $redirection_url;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $taco_request_id;
            proxy_set_header Remote-User $taco_user;
            proxy_set_header Remote-Groups $taco_groups;
            proxy_set_header X-Taco-Gateway $taco_gateway_secret;
            proxy_set_header Authorization "";
            proxy_pass $complaint_api;
        }

        # The case API's admin routes (fixture reset, fault injection); Authelia allows only the admin group.
        location ~ ^/case-admin/(?<admin_path>.*)$ {
            auth_request /internal/authelia/authz;
            auth_request_set $taco_user $upstream_http_remote_user;
            auth_request_set $taco_groups $upstream_http_remote_groups;
            proxy_set_header X-Request-ID $taco_request_id;
            proxy_set_header Remote-User $taco_user;
            proxy_set_header Remote-Groups $taco_groups;
            proxy_set_header X-Taco-Gateway $taco_gateway_secret;
            proxy_set_header Authorization "";
            proxy_pass http://case-api:8081/admin/$admin_path$is_args$args;
        }

        # API clients (CLI, harnesses, Locust): HTTP Basic, answered with 401 rather than a redirect.
        location / {
            auth_request /internal/authelia/authz;
            auth_request_set $taco_user $upstream_http_remote_user;
            auth_request_set $taco_groups $upstream_http_remote_groups;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $taco_request_id;
            proxy_set_header Remote-User $taco_user;
            proxy_set_header Remote-Groups $taco_groups;
            proxy_set_header X-Taco-Gateway $taco_gateway_secret;
            proxy_set_header Authorization "";
            proxy_pass $complaint_api;
        }
    }
}
