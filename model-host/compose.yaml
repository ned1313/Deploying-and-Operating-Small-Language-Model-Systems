# Model host project (GPU host): model server, gateway, and host/GPU exporters.
#
#   source model-host/env.sh              # exports COMPOSE_FILE and all ${VARS} used below
#   ./model-host/serve.sh qwen            # sets VLLM_ARGS for a candidate and (re)creates the vllm service
#   podman compose up -d gateway
#   podman compose up -d node-exporter dcgm-exporter          # module 4
#   ./model-host/pki/init-ca.sh                               # module 6: step-ca and the gateway certificate
#   podman compose stop gateway && podman compose up -d gateway-secure   # module 6: TLS on 8443, 8080 closed
#
# GPU access uses CDI: `sudo nvidia-ctk cdi generate --output=/etc/cdi/nvidia.yaml` once on the host.
# Always name the service you want (`up -d gateway`, `up -d vllm`); `vllm` requires VLLM_ARGS.
# Exporters start and stop independently of vLLM and the gateway. Evaluation and load tools live in tools/.

name: taco-model

services:
  vllm:
    container_name: vllm
    image: ${VLLM_IMAGE:?source model-host/env.sh first}
    # podman-compose shell-splits string commands before interpolating, so the argument string is
    # passed as an env var and split (with serve.sh's %q quoting honored) by bash in the container.
    entrypoint: ["/bin/bash", "-c", ": \"$${VLLM_ARGS:?empty - start this service with model-host/serve.sh}\"; eval exec vllm serve \"$$VLLM_ARGS\""]
    ipc: host
    devices:
      - nvidia.com/gpu=0
    ports:
      - "127.0.0.1:${VLLM_PORT:-8000}:8000"   # loopback only; the LAN reaches vLLM through the gateway
    volumes:
      - hf-cache:/root/.cache/huggingface
    environment:
      HF_TOKEN: ${HF_TOKEN:-}                  # from the shell, never stored here
      # Checked inside the container: a compose-level check would fail every command, e.g. `ps`.
      VLLM_ARGS: ${VLLM_ARGS:-}
      VLLM_LOGGING_LEVEL: DEBUG
      VLLM_USE_RUST_FRONTEND: "1"
    networks:
      inference:
        ipv4_address: ${VLLM_UPSTREAM_IP:-10.89.7.10}   # fixed so nginx's upstream survives model swaps
        aliases: [vllm]
    restart: "no"

  gateway:
    container_name: gateway
    image: ${NGINX_IMAGE:-docker.io/library/nginx:stable}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      inference:
        aliases: [gateway]
    restart: unless-stopped

  # Module 6: the same proxy with TLS, client-certificate identities, a route allowlist, and rate limits
  # (gateway/nginx.secure.conf). Run it instead of `gateway`; it publishes only on MODEL_HOST.
  gateway-secure:
    container_name: gateway-secure
    image: ${NGINX_IMAGE:-docker.io/library/nginx:1.30.6}
    ports:
      - "${MODEL_HOST:?source model-host/env.sh first}:${GATEWAY_TLS_PORT:-8443}:8443"
    environment:
      VLLM_UPSTREAM_IP: ${VLLM_UPSTREAM_IP:-10.89.7.10}
      NODE_EXPORTER_UPSTREAM: ${NODE_EXPORTER_UPSTREAM:-10.89.7.1:9100}
      GPU_EXPORTER_UPSTREAM: ${GPU_EXPORTER_UPSTREAM:-10.89.7.11:9400}
      NGINX_ENVSUBST_FILTER: "^(VLLM_UPSTREAM_IP|NODE_EXPORTER_UPSTREAM|GPU_EXPORTER_UPSTREAM)$$"
    volumes:
      - ./gateway/nginx.secure.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/upstreams.conf.template:/etc/nginx/templates/upstreams.conf.template:ro
      - ./secrets/pki/gateway:/etc/nginx/pki:ro    # gateway.crt/.key, root_ca.crt, revoked-serials.map (pki/init-ca.sh)
    networks:
      inference:
        aliases: [gateway-secure]
    restart: unless-stopped

  # Module 6: the course CA. Issues the gateway's server certificate and the desktop's client certificates.
  # First start: model-host/pki/init-ca.sh (sets STEP_CA_INIT_PASSWORD only for that run).
  step-ca:
    container_name: step-ca
    image: ${STEP_CA_IMAGE:-docker.io/smallstep/step-ca:0.30.2}
    environment:
      DOCKER_STEPCA_INIT_NAME: Taco Alley Course CA
      DOCKER_STEPCA_INIT_DNS_NAMES: ${CA_HOSTNAME:-ca.taco.internal},step-ca,localhost
      DOCKER_STEPCA_INIT_PROVISIONER_NAME: ${STEP_PROVISIONER:-taco}
      DOCKER_STEPCA_INIT_PASSWORD: ${STEP_CA_INIT_PASSWORD:-}
    ports:
      - "${MODEL_HOST:?source model-host/env.sh first}:${CA_PORT:-9000}:9000"
    volumes:
      - pki-data:/home/step
    networks:
      inference:
        aliases: [step-ca, "${CA_HOSTNAME:-ca.taco.internal}"]   # step's default CA URL uses the CA hostname
    restart: unless-stopped

  # Exporters (module 4). No authentication in modules 4-5: they bind to MODEL_HOST only, and the
  # desktop is the only intended client. Module 6 moves them off the LAN (NODE_EXPORTER_LISTEN,
  # GPU_EXPORTER_BIND) and gateway-secure serves them at /metrics/node and /metrics/gpu.
  node-exporter:
    container_name: node-exporter
    image: quay.io/prometheus/node-exporter:v1.12.1
    command:
      - --path.rootfs=/host
      - --web.listen-address=${NODE_EXPORTER_LISTEN:?source model-host/env.sh first}:${NODE_EXPORTER_PORT:-9100}
    network_mode: host      # host network and PID namespace so CPU, memory, and NIC metrics are the host's
    pid: host
    volumes:
      - /:/host:ro
    restart: unless-stopped

  dcgm-exporter:
    container_name: dcgm-exporter
    image: nvcr.io/nvidia/k8s/dcgm-exporter:4.5.2-4.8.1-ubuntu22.04
    command: ["-f", "/etc/dcgm-exporter/taco-counters.csv"]
    devices:
      - nvidia.com/gpu=0
    volumes:
      - ./exporters/dcgm-counters.csv:/etc/dcgm-exporter/taco-counters.csv:ro
    ports:
      - "${GPU_EXPORTER_BIND:?source model-host/env.sh first}:${GPU_EXPORTER_PORT:-9400}:9400"
    networks:
      inference:
        ipv4_address: ${GPU_EXPORTER_IP:-10.89.7.11}   # gateway-secure reaches it here (module 6)
    restart: unless-stopped

  # Fallback when dcgm-exporter cannot read the GPU: start this instead of dcgm-exporter (same port).
  # The Prometheus recording rules normalize both to the same series.
  nvidia-smi-exporter:
    container_name: nvidia-smi-exporter
    image: docker.io/utkuozdemir/nvidia_gpu_exporter:1.15.1
    devices:
      - nvidia.com/gpu=0
    ports:
      - "${GPU_EXPORTER_BIND:?source model-host/env.sh first}:${GPU_EXPORTER_PORT:-9400}:9835"
    networks:
      inference:
        ipv4_address: ${GPU_EXPORTER_IP:-10.89.7.11}   # module 6: set GPU_EXPORTER_UPSTREAM=10.89.7.11:9835
    restart: unless-stopped

networks:
  inference:
    name: taco-model-inference
    driver: bridge
    ipam:
      config:
        - subnet: ${INFERENCE_SUBNET:-10.89.7.0/24}

volumes:
  hf-cache:
    name: ${MODEL_CACHE_VOLUME:-hf-cache}
  pki-data:
    name: taco-pki-data
