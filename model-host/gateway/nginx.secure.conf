# Module 6 gateway: TLS, client-certificate identities, a route allowlist, request-size limits, and
# per-identity rate limits in front of vLLM and the host/GPU exporters. Started as the `gateway-secure`
# service; the modules 1-5 gateway (nginx.conf, plain HTTP on 8080) is stopped first.
#
# Identity: the course CA (step-ca) signs a client certificate per service. NGINX verifies it here and
# takes the identity from the certificate's CN. No identity server is called per request.

worker_processes 1;
events { worker_connections 1024; }

http {
    # vLLM, node-exporter, and the GPU exporter addresses (rendered from the environment at start).
    include /etc/nginx/conf.d/upstreams.conf;

    map $http_x_request_id $taco_request_id {
        "~^[A-Za-z0-9._-]{1,64}$" $http_x_request_id;
        default                  $request_id;
    }

    # ----- client identity ---------------------------------------------------------------------
    map $ssl_client_s_dn $taco_client_cn {
        "~(^|,)CN=(?<cn>[^,]+)" $cn;
        default                 "";
    }
    # Serials of rotated-out certificates (model-host/pki/deny-serial.sh); reloaded with `nginx -s reload`.
    map $ssl_client_serial $taco_revoked {
        include /etc/nginx/pki/revoked-serials.map;
        default 0;
    }
    # none: no valid certificate (401). unknown: a valid course certificate for an unknown CN (403).
    map "$ssl_client_verify:$taco_revoked:$taco_client_cn" $taco_client_state {
        "~^SUCCESS:0:(complaint-api|tools|prometheus)$" ok;
        "~^SUCCESS:0:"                                   unknown;
        default                                          none;
    }
    map $taco_client_state $taco_identity {
        ok      $taco_client_cn;
        default "";
    }
    map $taco_identity $taco_inference_allowed { complaint-api 1; tools 1; default 0; }
    map $taco_identity $taco_metrics_allowed   { prometheus 1;              default 0; }

    # ----- limits per identity (planning decision 11); an empty key is not counted ------------------
    limit_req_zone  $taco_identity zone=inference:1m rate=20r/s;
    limit_req_zone  $taco_identity zone=metrics:1m   rate=2r/s;
    limit_conn_zone $taco_identity zone=inference_conn:1m;
    limit_req_status  429;
    limit_conn_status 429;

    # One JSON line per request: identity and certificate serial, never bodies or credentials.
    log_format inference escape=json '{"ts":"$time_iso8601","request_id":"$taco_request_id",'
                         '"client":"$remote_addr","identity":"$taco_identity","cert_cn":"$taco_client_cn",'
                         '"cert_serial":"$ssl_client_serial","cert_verify":"$ssl_client_verify",'
                         '"method":"$request_method","route":"$uri","status":$status,'
                         '"request_time":$request_time,"upstream_response_time":"$upstream_response_time",'
                         '"bytes":$body_bytes_sent}';
    access_log /dev/stdout inference;
    error_log  /dev/stderr warn;

    server {
        listen 8443 ssl;
        server_name _;

        ssl_certificate        /etc/nginx/pki/gateway.crt;
        ssl_certificate_key    /etc/nginx/pki/gateway.key;
        ssl_protocols          TLSv1.2 TLSv1.3;
        # Ask for a client certificate and verify it against the course root; routes decide what is required.
        ssl_client_certificate /etc/nginx/pki/root_ca.crt;
        ssl_verify_client      optional;
        ssl_verify_depth       2;

        client_max_body_size 256k;
        client_body_timeout  10s;
        # A client certificate is checked once per connection; recycling connections makes a denied
        # serial (pki/deny-serial.sh) take effect for clients that keep connections open.
        keepalive_timeout  30s;
        keepalive_requests 100;
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        default_type application/json;

        # 495: certificate failed verification (expired, other CA); 496: none sent where required.
        error_page 495 496 = @unauthenticated;
        error_page 429 = @rate_limited;
        error_page 413 = @too_large;

        # Readiness without a certificate; no model details beyond the version string.
        location = /health  { proxy_pass http://vllm; }
        location = /version { proxy_pass http://vllm; }

        # ----- inference: complaint-api and tools ---------------------------------------------------
        location = /v1/chat/completions {
            limit_except POST { deny all; }
            if ($taco_client_state = none) { return 401 '{"error":"a client certificate signed by the course CA is required"}'; }
            if ($taco_inference_allowed = 0) { return 403 '{"error":"this identity may not call inference routes"}'; }
            limit_req  zone=inference burst=40;
            limit_conn inference_conn 16;
            proxy_pass         http://vllm;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Request-ID $taco_request_id;
            proxy_set_header   X-Client-Identity $taco_identity;
            proxy_set_header   Authorization "";
            proxy_set_header   Connection "";
            proxy_buffering    off;
            add_header         X-Request-ID $taco_request_id always;
        }

        location = /v1/models {
            limit_except GET { deny all; }
            if ($taco_client_state = none) { return 401 '{"error":"a client certificate signed by the course CA is required"}'; }
            if ($taco_inference_allowed = 0) { return 403 '{"error":"this identity may not call inference routes"}'; }
            limit_req  zone=inference burst=40;
            limit_conn inference_conn 16;
            proxy_pass         http://vllm;
            proxy_http_version 1.1;
            proxy_set_header   Authorization "";
            proxy_set_header   Connection "";
        }

        # ----- metrics: prometheus only ---------------------------------------------------------------
        location = /metrics {
            if ($taco_client_state = none) { return 401 '{"error":"a client certificate signed by the course CA is required"}'; }
            if ($taco_metrics_allowed = 0) { return 403 '{"error":"this identity may not read metrics"}'; }
            limit_req  zone=metrics burst=5;
            access_log off;
            proxy_pass http://vllm/metrics;
        }
        location = /metrics/node {
            if ($taco_client_state = none) { return 401 '{"error":"a client certificate signed by the course CA is required"}'; }
            if ($taco_metrics_allowed = 0) { return 403 '{"error":"this identity may not read metrics"}'; }
            limit_req  zone=metrics burst=5;
            access_log off;
            proxy_pass http://node_exporter/metrics;
        }
        location = /metrics/gpu {
            if ($taco_client_state = none) { return 401 '{"error":"a client certificate signed by the course CA is required"}'; }
            if ($taco_metrics_allowed = 0) { return 403 '{"error":"this identity may not read metrics"}'; }
            limit_req  zone=metrics burst=5;
            access_log off;
            proxy_pass http://gpu_exporter/metrics;
        }

        # Everything else vLLM serves (completions, embeddings, tokenize, admin and profiling routes) is not exposed.
        location / { return 404 '{"error":"not found"}'; }

        location @unauthenticated { return 401 '{"error":"a valid client certificate signed by the course CA is required"}'; }
        location @rate_limited    { add_header Retry-After 1 always; return 429 '{"error":"rate limit exceeded for this identity"}'; }
        location @too_large       { return 413 '{"error":"request body larger than 256 KB"}'; }
    }
}
