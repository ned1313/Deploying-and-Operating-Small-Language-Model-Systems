# Module 1 gateway: a thin, unauthenticated reverse proxy in front of vLLM so the desktop can reach
# the model without exposing the vLLM port. Module 6 adds TLS, service keys, route restrictions,
# request-size limits, and rate limits to this same file.

worker_processes 1;
events { worker_connections 1024; }

http {
    upstream vllm {
        # Fixed address assigned to the vllm service in compose.yaml (VLLM_UPSTREAM_IP). Podman's
        # DNS only answers for running containers, so a name here would break every model swap.
        server 10.89.7.10:8000;
    }

    # Request/upstream timing for latency discussions (client-observed vs server-side inference time).
    log_format inference '$remote_addr [$time_local] "$request" $status '
                         'rt=$request_time urt=$upstream_response_time bytes=$body_bytes_sent';
    access_log /dev/stdout inference;
    error_log  /dev/stderr warn;

    server {
        listen 8080;

        client_max_body_size 1m;
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;   # long generations and queueing under load

        location / {
            proxy_pass         http://vllm;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Request-ID $request_id;
            proxy_set_header   Connection "";
            proxy_buffering    off;   # required for streaming (SSE) responses
            proxy_cache        off;
        }
    }
}
