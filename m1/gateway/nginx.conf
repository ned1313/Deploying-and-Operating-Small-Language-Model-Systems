# Module 1 gateway: a thin, unauthenticated reverse proxy in front of vLLM so the desktop can reach
# the model without exposing the vLLM port. Module 6 adds TLS, service keys, route restrictions,
# request-size limits, and rate limits to this same file.

worker_processes 1;
events { worker_connections 1024; }

http {
    upstream vllm {
        # Fixed address assigned to the vllm service in compose.yaml (VLLM_UPSTREAM_IP). Podman's
        # DNS only answers for running containers, so a name here would break every model swap.
        server 10.89.7.10:8000;
    }

    # Keep a well-formed caller request id (the complaint API sends its own) so gateway and application
    # logs join on it; otherwise use nginx's generated id.
    map $http_x_request_id $taco_request_id {
        "~^[A-Za-z0-9._-]{1,64}$" $http_x_request_id;
        default                  $request_id;
    }

    # One JSON line per request: timing for client-observed vs server-side latency. No bodies or credentials.
    log_format inference escape=json '{"ts":"$time_iso8601","request_id":"$taco_request_id",'
                         '"client":"$remote_addr","method":"$request_method","route":"$uri",'
                         '"status":$status,"request_time":$request_time,'
                         '"upstream_response_time":"$upstream_response_time","bytes":$body_bytes_sent}';
    access_log /dev/stdout inference;
    error_log  /dev/stderr warn;

    server {
        listen 8080;

        client_max_body_size 1m;
        proxy_connect_timeout 10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;   # long generations and queueing under load

        location / {
            proxy_pass         http://vllm;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Request-ID $taco_request_id;
            proxy_set_header   Connection "";
            proxy_buffering    off;   # required for streaming (SSE) responses
            proxy_cache        off;
            add_header         X-Request-ID $taco_request_id always;
        }

        # Prometheus scrapes this every few seconds (module 4); unauthenticated until module 6.
        location = /metrics {
            access_log         off;
            proxy_pass         http://vllm;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
        }
    }
}
