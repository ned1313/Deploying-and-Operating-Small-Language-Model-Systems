# Module 3 application project. Superset of m2/compose.yaml: same project name, network, and volumes,
# plus the complaint API, the CLI client, and the Demo 3.2 harnesses. From module 3 on, run from m3/.
#
#   cp .env.example .env                                      # copy inference values from m2/.env
#   cp ../m2/secrets/inference_api_key secrets/
#   podman network create taco-telemetry                      # once per desktop; shared with module 4 monitoring
#   podman-compose build
#   podman-compose run --rm seed                              # no-op if module 2 already seeded
#   podman-compose up -d --force-recreate case-api complaint-api
#   podman-compose run --rm cli submit A01
#
# The model server is NOT part of this project; it runs independently on the GPU host (module 1).
# No `profiles:` (podman-compose 1.0.x hides profiled services) and no `depends_on` on one-shot services
# (`podman-compose run` would recreate the running APIs). Always name services with `up`; avoid `down`.

name: taco-app

x-app-image: &app-image
  image: localhost/taco-m3-app:latest
  build:
    context: ..
    dockerfile: m3/Containerfile
    args:
      APP_VERSION: ${APP_VERSION:-dev}

x-inference-env: &inference-env
  INFERENCE_BASE_URL: ${INFERENCE_BASE_URL:?copy .env.example to .env and set INFERENCE_BASE_URL}
  INFERENCE_MODEL: ${INFERENCE_MODEL:?set INFERENCE_MODEL in .env}
  INFERENCE_TIMEOUT_SECONDS: ${INFERENCE_TIMEOUT_SECONDS:-120}
  INFERENCE_EXTRA_BODY: ${INFERENCE_EXTRA_BODY:-}
  INFERENCE_TOOL_CALLING: ${INFERENCE_TOOL_CALLING:-native}
  INFERENCE_STRUCTURED_OUTPUT: ${INFERENCE_STRUCTURED_OUTPUT:-json_schema}
  INFERENCE_MAX_RETRIES: ${INFERENCE_MAX_RETRIES:-2}
  INFERENCE_API_KEY_FILE: /run/secrets/inference_api_key
  AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-8}
  AGENT_MAX_OUTPUT_TOKENS: ${AGENT_MAX_OUTPUT_TOKENS:-800}
  WORKFLOW_MAX_NUDGES: ${WORKFLOW_MAX_NUDGES:-1}
  WORKFLOW_MAX_CORRECTIONS: ${WORKFLOW_MAX_CORRECTIONS:-1}
  WORKFLOW_RUN_TIMEOUT_SECONDS: ${WORKFLOW_RUN_TIMEOUT_SECONDS:-90}
  WORKFLOW_MAX_CONCURRENT_RUNS: ${WORKFLOW_MAX_CONCURRENT_RUNS:-4}
  WORKFLOW_QUEUE_TIMEOUT_SECONDS: ${WORKFLOW_QUEUE_TIMEOUT_SECONDS:-60}
  CASE_API_TIMEOUT_SECONDS: ${CASE_API_TIMEOUT_SECONDS:-3}
  CASE_API_RETRIES: ${CASE_API_RETRIES:-2}
  CASE_API_BACKOFF_SECONDS: ${CASE_API_BACKOFF_SECONDS:-0.5}
  TACO_POLICY_VERSION: ${TACO_POLICY_VERSION:-2026.09}
  TACO_APP_DB: /data/app/taco_app.db
  TACO_STATE_DIR: /data/state
  TACO_ADMIN_TOKEN: ${TACO_ADMIN_TOKEN:-}
  CASE_API_URL: http://case-api:8081

x-client-env: &client-env
  COMPLAINT_API_URL: http://complaint-api:8090
  CASE_API_URL: http://case-api:8081
  TACO_ADMIN_TOKEN: ${TACO_ADMIN_TOKEN:-}
  RESULTS_DIR: /app/results

services:
  case-api:
    image: localhost/taco-case-api:latest
    build:
      context: ..
      dockerfile: shared/services/mock_case_api/Containerfile
    environment:
      TACO_ADMIN_TOKEN: ${TACO_ADMIN_TOKEN:-}
    volumes:
      - taco-case-data:/data/cases
    ports:
      - "${PUBLISH_ADDRESS:-127.0.0.1}:${CASE_API_PORT:-8081}:8081"   # loopback by default, for on-camera curl
    healthcheck:
      test: ["CMD", "python", "-m", "taco_shared.healthcheck", "http://127.0.0.1:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  complaint-api:
    <<: *app-image
    environment: *inference-env
    # LANGSMITH_* settings (module 4). Values must be unquoted: podman passes env-file values literally.
    env_file:
      - ${TRACING_ENV_FILE:-./tracing-off.env}
    secrets:
      - inference_api_key
    volumes:
      - taco-app-data:/data/app:ro    # seeded orders and history; written only by `seed`
      - taco-app-state:/data/state    # checkpoints.db and app.db; this service is the only writer
    ports:
      - "${PUBLISH_ADDRESS:-127.0.0.1}:${COMPLAINT_API_PORT:-8090}:8090"   # X-Actor-Id is an unauthenticated claim: keep this host-only
    networks:
      - default
      - telemetry                     # module 4 Prometheus scrapes /metrics here; joining grants no API rights
    healthcheck:
      test: ["CMD", "python", "-m", "taco_shared.healthcheck", "http://127.0.0.1:8090/healthz?remote=false"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  seed:
    # One-shot: podman-compose run --rm seed [--reset]
    <<: *app-image
    entrypoint: ["python", "-m", "taco_shared.dataset.seed"]
    command: []
    environment:
      TACO_APP_DB: /data/app/taco_app.db
    volumes:
      - taco-app-data:/data/app

  cli:
    # podman-compose run --rm cli submit A01 | show CASE-10431 | reviews | approve CASE-10431 ...
    <<: *app-image
    entrypoint: ["python", "clients/taco_cli.py"]
    command: ["--help"]
    environment: *client-env

  failure-tests:
    # podman-compose run --rm failure-tests [--only C01,F03]
    <<: *app-image
    entrypoint: ["python", "eval/failure_tests.py"]
    command: []
    environment: *client-env
    volumes:
      - ${RESULTS_DIR:-./results}:/app/results

  e2e-eval:
    # podman-compose run --rm e2e-eval --label e2e-baseline
    <<: *app-image
    entrypoint: ["python", "eval/run_e2e_scenarios.py"]
    command: []
    environment: *client-env
    volumes:
      - ${RESULTS_DIR:-./results}:/app/results

  e2e-compare:
    # podman-compose run --rm e2e-compare '/m1-results/screening-<model>-*.json' '/m2-results/agent-<model>-*.json' 'results/e2e-<model>-*.json'
    <<: *app-image
    entrypoint: ["python", "eval/compare_e2e.py"]
    command: []
    volumes:
      - ${RESULTS_DIR:-./results}:/app/results:ro
      - ${M1_RESULTS_DIR:-../m1/results}:/m1-results:ro
      - ${M2_RESULTS_DIR:-../m2/results}:/m2-results:ro

  tests:
    # podman-compose run --rm tests   (no network or GPU needed)
    <<: *app-image
    entrypoint: ["sh", "-c"]
    command: ["pytest -q -p no:cacheprovider /opt/shared/tests && pytest -q -p no:cacheprovider /app/tests"]
    network_mode: none

secrets:
  inference_api_key:
    file: ./secrets/inference_api_key

volumes:
  taco-app-data:
    name: taco-app-data
  taco-case-data:
    name: taco-case-data
  taco-app-state:
    name: taco-app-state

networks:
  default:
    name: taco-app-private
  telemetry:
    external: true
    name: taco-telemetry
