# Observability project (desktop): Prometheus and Grafana. Run every command from observability/.
# Independent of taco-app: stopping this project never stops complaint processing.
#
#   cp .env.example .env                                   # MODEL_HOST, ports
#   printf '%s' "$(openssl rand -hex 16)" > ../secrets/grafana_admin_password
#   podman network create taco-telemetry                   # once; the app setup may have done it
#   podman-compose up -d prometheus grafana
#
# Load generation and the baseline report are one-shots in tools/. Model-host exporters run on the GPU
# host (model-host/compose.yaml). Avoid `down`; use `stop` and `up -d <service>`.

name: taco-observe

services:
  prometheus:
    image: docker.io/prom/prometheus:v3.15.0
    entrypoint: ["/bin/sh", "/etc/prometheus/start.sh"]
    environment:
      MODEL_HOST: ${MODEL_HOST:?copy .env.example to .env and set MODEL_HOST}
      GATEWAY_PORT: ${GATEWAY_PORT:-8080}
      NODE_EXPORTER_PORT: ${NODE_EXPORTER_PORT:-9100}
      GPU_EXPORTER_PORT: ${GPU_EXPORTER_PORT:-9400}
      PROMETHEUS_RETENTION: ${PROMETHEUS_RETENTION:-30d}
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - taco-observe-prometheus:/prometheus
    ports:
      - "${PUBLISH_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - default
      - telemetry
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: "true"         # read-only viewing without a login; editing needs admin
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/complaint-workflow.json
    secrets:
      - grafana_admin_password
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - taco-observe-grafana:/var/lib/grafana
    ports:
      - "${PUBLISH_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    restart: unless-stopped

secrets:
  grafana_admin_password:
    file: ../secrets/grafana_admin_password

volumes:
  taco-observe-prometheus:
    name: taco-observe-prometheus
  taco-observe-grafana:
    name: taco-observe-grafana

networks:
  default:
    name: taco-observe-private
  telemetry:
    external: true
    name: taco-telemetry
