# Module 4 observability project (desktop): Prometheus, Grafana, and disposable load and baseline runs.
# Independent of taco-app: stopping this project never stops complaint processing.
#
#   cp .env.example .env                                   # MODEL_HOST, LangSmith, load settings
#   printf '%s' "$(openssl rand -hex 16)" > secrets/grafana_admin_password
#   podman network create taco-telemetry                   # once; module 3 setup may have done it
#   podman-compose build load
#   podman-compose up -d prometheus grafana
#   podman-compose run --rm load --mode app --shape burst
#   podman-compose run --rm baseline
#
# No `profiles:` and no `depends_on` on one-shot services (podman-compose 1.0.6). Avoid `down`;
# use `stop` and `up -d <service>`. Model-host exporters run on the GPU host (model-host/compose.yaml).

name: taco-observe

x-load-image: &load-image
  image: localhost/taco-m4-load:latest
  build:
    context: ..
    dockerfile: m4/load/Containerfile

services:
  prometheus:
    image: docker.io/prom/prometheus:v3.15.0
    entrypoint: ["/bin/sh", "/etc/prometheus/start.sh"]
    environment:
      MODEL_HOST: ${MODEL_HOST:?copy .env.example to .env and set MODEL_HOST}
      GATEWAY_PORT: ${GATEWAY_PORT:-8080}
      NODE_EXPORTER_PORT: ${NODE_EXPORTER_PORT:-9100}
      GPU_EXPORTER_PORT: ${GPU_EXPORTER_PORT:-9400}
      PROMETHEUS_RETENTION: ${PROMETHEUS_RETENTION:-30d}
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - taco-observe-prometheus:/prometheus
    ports:
      - "${PUBLISH_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - default
      - telemetry
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: "true"         # read-only viewing without a login; editing needs admin
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/complaint-workflow.json
    secrets:
      - grafana_admin_password
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - taco-observe-grafana:/var/lib/grafana
    ports:
      - "${PUBLISH_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    restart: unless-stopped

  load:
    # podman-compose run --rm load --mode direct|app --shape steady|burst [--users 2 --burst-users 8]
    <<: *load-image
    command: ["--help"]
    environment:
      INFERENCE_BASE_URL: http://${MODEL_HOST}:${GATEWAY_PORT:-8080}/v1
      INFERENCE_MODEL: ${INFERENCE_MODEL:?set INFERENCE_MODEL in .env}
      INFERENCE_EXTRA_BODY: ${INFERENCE_EXTRA_BODY:-}
      INFERENCE_API_KEY_FILE: /run/secrets/inference_api_key
      COMPLAINT_API_URL: http://complaint-api:8090
      CASE_API_URL: http://case-api:8081
      TACO_ADMIN_TOKEN: ${TACO_ADMIN_TOKEN:-}
      EXECUTION_HOST: ${EXECUTION_HOST:-desktop}
    secrets:
      - inference_api_key
    volumes:
      - ${RESULTS_DIR:-./results}:/app/results
    networks:
      - app        # a client of the complaint API, like the module 3 CLI

  baseline:
    # podman-compose run --rm baseline [results/load-<label>-<ts>-meta.json] [--label name]
    <<: *load-image
    entrypoint: ["python", "/app/eval/baseline_report.py"]
    command: []
    environment:
      PROMETHEUS_URL: http://prometheus:9090
    volumes:
      - ${RESULTS_DIR:-./results}:/app/results

secrets:
  grafana_admin_password:
    file: ./secrets/grafana_admin_password
  inference_api_key:
    file: ../m3/secrets/inference_api_key

volumes:
  taco-observe-prometheus:
    name: taco-observe-prometheus
  taco-observe-grafana:
    name: taco-observe-grafana

networks:
  default:
    name: taco-observe-private
  telemetry:
    external: true
    name: taco-telemetry
  app:
    external: true
    name: taco-app-private
