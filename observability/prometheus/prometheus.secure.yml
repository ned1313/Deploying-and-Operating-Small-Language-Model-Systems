# Prometheus for the Taco Alley deployment, module 6: the model-host jobs scrape the secure gateway over
# TLS with the `prometheus` client certificate. Selected by PROMETHEUS_CONFIG=prometheus.secure.yml in
# observability/.env. Job names, targets' instance labels, and recording rules are the same as in
# prometheus.yml, so dashboards keep one continuous series across the switch.

global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    deployment: taco-alley

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels: {instance: prometheus, host: desktop}

  - job_name: complaint-api
    static_configs:
      - targets: ["complaint-api:8090"]
        labels: {instance: complaint-api, host: desktop}

  # vLLM, node-exporter, and the GPU exporter, all through gateway-secure (slm.taco.internal:8443).
  - job_name: vllm
    scheme: https
    metrics_path: /metrics
    tls_config: &gateway_tls
      ca_file: /etc/prometheus-certs/root_ca.crt
      cert_file: /etc/prometheus-certs/tls.crt
      key_file: /etc/prometheus-certs/tls.key
    file_sd_configs:
      - files: ["/tmp/targets/vllm.json"]

  - job_name: node
    scheme: https
    metrics_path: /metrics/node
    tls_config: *gateway_tls
    file_sd_configs:
      - files: ["/tmp/targets/node.json"]

  - job_name: gpu
    scheme: https
    metrics_path: /metrics/gpu
    tls_config: *gateway_tls
    file_sd_configs:
      - files: ["/tmp/targets/gpu.json"]
