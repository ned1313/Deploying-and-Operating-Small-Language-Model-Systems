# Tools project (either host): disposable evaluation, load, and report commands, plus the test suites.
# Run every command from tools/ (on the GPU host, use the `tools` shell function from model-host/env.sh).
#
#   cp .env.example .env                                  # target URLs; see the GPU host notes inside
#   podman-compose build
#   podman-compose run --rm smoke --skip-structured       # module 1, against INFERENCE_BASE_URL
#   podman-compose run --rm e2e-eval --label e2e-baseline # module 3, against the running complaint API
#   podman-compose run --rm load --mode app --shape burst # module 4
#   podman-compose run --rm tests                         # all test suites, no network
#
# Results go to ../results/<kind>/ on the machine that runs the command. Services that call the
# complaint API join taco-app-private, and `baseline` joins taco-telemetry, so those run on the desktop
# after app/ (and observability/) are up. Serving services only need the gateway URL and run anywhere.

name: taco-tools

x-tools-image: &tools-image
  image: localhost/taco-tools:latest
  build:
    context: ..
    dockerfile: tools/Containerfile

x-serving-env: &serving-env
  BASE_URL: ${INFERENCE_BASE_URL:-http://host.containers.internal:8080/v1}
  MODEL: ${MODEL:-}                  # empty: use the model the server lists
  EXTRA_BODY: ${EXTRA_BODY:-}
  # Module 6: the course root CA and the tools client certificate (empty: plain HTTP, modules 1-5).
  INFERENCE_CA_FILE: ${INFERENCE_CA_FILE:-}
  INFERENCE_CLIENT_CERT_FILE: ${INFERENCE_CLIENT_CERT_FILE:-}
  INFERENCE_CLIENT_KEY_FILE: ${INFERENCE_CLIENT_KEY_FILE:-}

x-inference-env: &inference-env
  INFERENCE_BASE_URL: ${INFERENCE_BASE_URL:-http://host.containers.internal:8080/v1}
  INFERENCE_MODEL: ${INFERENCE_MODEL:-}
  INFERENCE_TIMEOUT_SECONDS: ${INFERENCE_TIMEOUT_SECONDS:-120}
  INFERENCE_EXTRA_BODY: ${INFERENCE_EXTRA_BODY:-}
  INFERENCE_TOOL_CALLING: ${INFERENCE_TOOL_CALLING:-native}
  INFERENCE_STRUCTURED_OUTPUT: ${INFERENCE_STRUCTURED_OUTPUT:-json_schema}
  INFERENCE_API_KEY_FILE: /run/secrets/inference_api_key
  INFERENCE_CA_FILE: ${INFERENCE_CA_FILE:-}
  INFERENCE_CLIENT_CERT_FILE: ${INFERENCE_CLIENT_CERT_FILE:-}
  INFERENCE_CLIENT_KEY_FILE: ${INFERENCE_CLIENT_KEY_FILE:-}

x-client-env: &client-env
  COMPLAINT_API_URL: http://complaint-api:8090
  CASE_API_URL: http://case-api:8081
  TACO_ADMIN_TOKEN: ${TACO_ADMIN_TOKEN:-}
  # Module 6: through app-gateway with HTTP Basic; admin calls as the synthetic admin-01 user.
  APP_AUTH_MODE: ${APP_AUTH_MODE:-header}
  APP_GATEWAY_URL: https://${APP_HOSTNAME:-app.taco.internal}:8443
  APP_CA_FILE: /run/taco-ca/root_ca.crt
  TACO_USER_PASSWORD_FILE: /run/taco-users/password

# Module 6: the tools identity's client certificate, the root CA, and the model gateway's name.
x-tools-cert: &tools-cert ../secrets/certs/tools:/run/taco-certs:ro
x-model-host: &model-host
  - "${SLM_HOSTNAME:-slm.taco.internal}:${MODEL_HOST:-127.0.0.1}"

services:
  # ----- model serving (module 1): gateway URL only ------------------------------------------------
  smoke:
    # podman-compose run --rm smoke [--skip-structured] [--extra-body '{...}'] [record flags]
    <<: *tools-image
    entrypoint: ["python", "-m", "taco_tools.serving.smoke_test"]
    command: []
    environment:
      <<: *serving-env
      RESULTS_DIR: /app/results/serving
    volumes:
      - ../results:/app/results
      - *tools-cert
    extra_hosts: *model-host

  screen:
    # podman-compose run --rm screen --model <served-name> --extra-body '{...}' --label baseline
    <<: *tools-image
    entrypoint: ["python", "-m", "taco_tools.serving.screen_models"]
    command: []
    environment:
      <<: *serving-env
      RESULTS_DIR: /app/results/screening
    volumes:
      - ../results:/app/results
      - *tools-cert
    extra_hosts: *model-host

  compare-screening:
    # podman-compose run --rm compare-screening 'results/screening/screening-*-baseline-*.json'
    <<: *tools-image
    entrypoint: ["python", "-m", "taco_tools.serving.compare_screening"]
    command: []
    volumes:
      - ../results:/app/results:ro

  load-sweep:
    # podman-compose run --rm load-sweep --concurrency 1,4,8,16,32 --requests-per-level 32 --label baseline
    <<: *tools-image
    entrypoint: ["python", "-m", "taco_tools.serving.load_sweep"]
    command: []
    environment:
      <<: *serving-env
      RESULTS_DIR: /app/results/sweep
    volumes:
      - ../results:/app/results
      - *tools-cert
    extra_hosts: *model-host

  compare-load:
    # podman-compose run --rm compare-load 'results/sweep/load-*.json'
    <<: *tools-image
    entrypoint: ["python", "-m", "taco_tools.serving.compare_load"]
    command: []
    environment:
      RESULTS_DIR: /app/results/sweep
    volumes:
      - ../results:/app/results

  python:
    # podman-compose run --rm python -c '<code using taco_shared>'; BASE_URL is the configured endpoint
    <<: *tools-image
    entrypoint: ["python"]
    command: ["--version"]
    environment:
      <<: *serving-env
    volumes:
      - *tools-cert
    extra_hosts: *model-host

  # ----- agent and application evaluation (modules 2-3): desktop, app project running ------------
  agent-eval:
    # podman-compose run --rm agent-eval --label agent-baseline
    <<: *tools-image
    entrypoint: ["python", "-m", "taco_tools.agent_eval.run_agent_scenarios"]
    command: []
    environment:
      <<: *inference-env
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-8}
      AGENT_MAX_OUTPUT_TOKENS: ${AGENT_MAX_OUTPUT_TOKENS:-800}
      TACO_POLICY_VERSION: ${TACO_POLICY_VERSION:-2026.09}
      TACO_APP_DB: /data/app/taco_app.db
      CASE_API_URL: http://case-api:8081
      RESULTS_DIR: /app/results/agent
    secrets:
      - inference_api_key
    volumes:
      - taco-app-data:/data/app:ro    # the app project's seeded database; never written here
      - ../results:/app/results
      - *tools-cert
    extra_hosts: *model-host
    networks:
      - app

  agent-compare:
    # podman-compose run --rm agent-compare 'results/screening/screening-<model>-*.json' 'results/agent/agent-<model>-*.json'
    <<: *tools-image
    entrypoint: ["python", "-m", "taco_tools.agent_eval.compare_agent_vs_screening"]
    command: []
    volumes:
      - ../results:/app/results:ro

  failure-tests:
    # podman-compose run --rm failure-tests [--only C01,F03]
    <<: *tools-image
    entrypoint: ["python", "-m", "taco_tools.e2e.failure_tests"]
    command: []
    environment:
      <<: *client-env
      RESULTS_DIR: /app/results/failure
    volumes:
      - ../results:/app/results
      - ../secrets/ca:/run/taco-ca:ro
      - ../secrets/users:/run/taco-users:ro
    networks:
      - app

  e2e-eval:
    # podman-compose run --rm e2e-eval --label e2e-baseline
    <<: *tools-image
    entrypoint: ["python", "-m", "taco_tools.e2e.run_e2e_scenarios"]
    command: []
    environment:
      <<: *client-env
      RESULTS_DIR: /app/results/e2e
    volumes:
      - ../results:/app/results
      - ../secrets/ca:/run/taco-ca:ro
      - ../secrets/users:/run/taco-users:ro
    networks:
      - app

  e2e-compare:
    # podman-compose run --rm e2e-compare 'results/screening/screening-<model>-*.json' 'results/agent/agent-<model>-*.json' 'results/e2e/e2e-<model>-*.json'
    <<: *tools-image
    entrypoint: ["python", "-m", "taco_tools.e2e.compare_e2e"]
    command: []
    volumes:
      - ../results:/app/results:ro

  # ----- load and baseline (module 4 onward): desktop -------------------------------------------
  load:
    # podman-compose run --rm load --mode direct|app --shape steady|burst [--users 2 --burst-users 8]
    <<: *tools-image
    entrypoint: ["python", "-m", "taco_tools.load.run"]
    command: ["--help"]
    environment:
      <<: [*inference-env, *client-env]
      EXECUTION_HOST: ${EXECUTION_HOST:-desktop}
      RESULTS_DIR: /app/results/load
    secrets:
      - inference_api_key
    volumes:
      - ../results:/app/results
      - *tools-cert
      - ../secrets/ca:/run/taco-ca:ro
      - ../secrets/users:/run/taco-users:ro
    extra_hosts: *model-host
    networks:
      - app        # a client of the complaint API, like the CLI

  baseline:
    # podman-compose run --rm baseline [results/load/load-<label>-<ts>-meta.json] [--label name]
    <<: *tools-image
    entrypoint: ["python", "-m", "taco_tools.reports.baseline_report"]
    command: []
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      RESULTS_DIR: /app/results/baseline
      LOAD_RESULTS_DIR: /app/results/load
    volumes:
      - ../results:/app/results
    networks:
      - telemetry  # reaches the observability project's Prometheus by name

  # ----- quality, releases, and cost (module 5): desktop -------------------------------------------
  quality:
    # podman-compose run --rm quality score | report | queue | show <id> | review <id> --tone 4 ...
    <<: *tools-image
    entrypoint: ["python", "-m", "taco_tools.quality.quality"]
    command: ["--help"]
    environment:
      QUALITY_DB: /data/quality/quality.db
      RESULTS_DIR: /app/results/quality
    volumes:
      - taco-app-quality:/data/quality  # the app's evaluation store; complaint-api writes samples, this writes scores
      - ../results:/app/results

  release:
    # podman-compose run --rm release --baseline r1-qwen3-14b --candidate r2-llama-3.1-8b
    <<: *tools-image
    entrypoint: ["python", "-m", "taco_tools.quality.release_report"]
    command: ["--help"]
    environment:
      RESULTS_ROOT: /app/results
    volumes:
      - ../results:/app/results
      - ../model-host/releases:/app/releases:ro

  cost:
    # podman-compose run --rm cost <load label> [<load label>]
    <<: *tools-image
    entrypoint: ["python", "-m", "taco_tools.quality.cost_report"]
    command: ["--help"]
    environment:
      QUALITY_DB: /data/quality/quality.db
      RESULTS_ROOT: /app/results
      PROMETHEUS_URL: http://prometheus:9090
      COST_GPU_HOST_PRICE_USD: ${COST_GPU_HOST_PRICE_USD:-3000}
      COST_AMORTIZATION_YEARS: ${COST_AMORTIZATION_YEARS:-3}
      COST_ELECTRICITY_USD_PER_KWH: ${COST_ELECTRICITY_USD_PER_KWH:-0.15}
      COST_HOST_OVERHEAD_WATTS: ${COST_HOST_OVERHEAD_WATTS:-120}
      COST_DESKTOP_SHARE_USD_PER_HOUR: ${COST_DESKTOP_SHARE_USD_PER_HOUR:-0.05}
      COST_CLOUD_GPU_USD_PER_HOUR: ${COST_CLOUD_GPU_USD_PER_HOUR:-1.00}
      COST_REVIEW_USD_PER_CASE: ${COST_REVIEW_USD_PER_CASE:-0}
    volumes:
      - taco-app-quality:/data/quality
      - ../results:/app/results
    networks:
      - telemetry

  # ----- security (module 6) -----------------------------------------------------------------------
  gateway-check:
    # podman-compose run --rm gateway-check [--extra-cert <crt> <key> 401]
    <<: *tools-image
    entrypoint: ["python", "-m", "taco_tools.security.gateway_check"]
    command: []
    environment:
      <<: *inference-env
      RESULTS_DIR: /app/results/security
    volumes:
      - ../results:/app/results
      - *tools-cert
      - ../secrets/rotated:/run/taco-rotated:ro   # certificates replaced by scripts/issue-certs.sh --rotate
    extra_hosts: *model-host

  # ----- tests: every suite against the mounted source, no network or GPU -----------------------
  tests:
    # podman-compose run --rm tests
    <<: *tools-image
    entrypoint: ["sh", "-c"]
    command:
      - >-
        pytest -q -p no:cacheprovider /src/shared/tests
        && cd /src/app && pytest -q -p no:cacheprovider tests
        && cd /src/tools && pytest -q -p no:cacheprovider tests
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      TACO_CASE_API_MAIN: /src/app/case_api/main.py
    volumes:
      - ..:/src:ro
    network_mode: none

secrets:
  inference_api_key:
    file: ../secrets/inference_api_key

volumes:
  taco-app-data:
    external: true
    name: taco-app-data
  taco-app-quality:
    external: true
    name: taco-app-quality

networks:
  default:
    name: taco-tools-private
  app:
    external: true
    name: taco-app-private
  telemetry:
    external: true
    name: taco-telemetry
